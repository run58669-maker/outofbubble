services:
  - type: web
    name: outofbubble
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: QLOO_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: PORT
        value: 3000
